<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Greater Lafayette Corridor Study</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #1a1a2e; background: #fafbfc; line-height: 1.7;
  }
  header {
    background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
    color: #fff; padding: 24px 32px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header nav a {
    color: #a0b4d0; text-decoration: none; margin-left: 20px; font-size: 0.9rem;
  }
  header nav a:hover { color: #fff; }
  main { max-width: 820px; margin: 0 auto; padding: 48px 24px 80px; }
  #faq-content h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; color: #0f3460; }
  #faq-content h2 {
    font-size: 1.4rem; font-weight: 700; color: #0f3460;
    margin-top: 48px; margin-bottom: 16px;
    padding-bottom: 8px; border-bottom: 2px solid #e5e7eb;
  }
  #faq-content h3 {
    font-size: 1.1rem; font-weight: 600; color: #1a1a2e;
    margin-top: 32px; margin-bottom: 12px;
  }
  #faq-content p { margin-bottom: 16px; color: #374151; }
  #faq-content ul, #faq-content ol { margin-bottom: 16px; padding-left: 24px; color: #374151; }
  #faq-content li { margin-bottom: 6px; }
  #faq-content strong { color: #1a1a2e; }
  #faq-content em { font-style: italic; }
  #faq-content hr { border: none; border-top: 2px solid #e5e7eb; margin: 40px 0; }
  #faq-content table {
    width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 0.9rem;
    display: block; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #faq-content th {
    background: #f3f4f6; padding: 10px 12px; text-align: left;
    border-bottom: 2px solid #d1d5db; font-weight: 600;
  }
  #faq-content td { padding: 8px 12px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  .loading { text-align: center; padding: 60px; color: #9ca3af; }
  footer {
    background: #16213e; color: #a0b4d0; text-align: center;
    padding: 24px; font-size: 0.85rem;
  }
  footer a { color: #06b6d4; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  @media (max-width: 600px) {
    header { padding: 16px; }
    header h1 { font-size: 1rem; }
    main { padding: 24px 16px 60px; }
    #faq-content h1 { font-size: 1.5rem; }
    #faq-content h2 { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1><a href="index.html" style="color:inherit;text-decoration:none;">Greater Lafayette Corridor Study</a></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="viewer.html">Viewer</a>
    <a href="faq.html" style="color:#fff;">FAQ</a>
    <a href="https://github.com/Brian-Foerster/Greater-Lafayette-Corridor-Analysis" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<main>
  <div id="faq-content">
    <div class="loading">Loading FAQ&hellip;</div>
  </div>
</main>

<footer>
  Brian Foerster
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
fetch('TECHNICAL_FAQ.md')
  .then(r => {
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.text();
  })
  .then(md => {
    document.getElementById('faq-content').innerHTML = marked.parse(md);
  })
  .catch(err => {
    document.getElementById('faq-content').innerHTML =
      '<p>Could not load FAQ. <a href="TECHNICAL_FAQ.md">View the Markdown source</a>.</p>';
  });
</script>
<script data-goatcounter="https://corridor-viewer.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
