name: Geometry Change Rerun Smoke

on:
  push:
    branches: [ main ]
    paths:
      - "data/processed/**/*corridor*.geojson"
      - "data/processed/**/*stops*.geojson"
      - "data/processed/**/*geometry*.csv"
      - "scripts/geometry_change_detector.py"
      - "scripts/run_geometry_rerun_smoke.py"
      - ".github/workflows/geometry-rerun-smoke.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "data/processed/**/*corridor*.geojson"
      - "data/processed/**/*stops*.geojson"
      - "data/processed/**/*geometry*.csv"
      - "scripts/geometry_change_detector.py"
      - "scripts/run_geometry_rerun_smoke.py"
      - ".github/workflows/geometry-rerun-smoke.yml"

jobs:
  geometry-rerun-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Resolve Git Refs
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect geometry changes
        id: detect
        run: |
          python scripts/geometry_change_detector.py \
            --base-ref "${{ steps.refs.outputs.base_ref }}" \
            --head-ref "${{ steps.refs.outputs.head_ref }}" \
            --output-json data/processed/geometry_change_detection.json \
            --output-csv data/processed/geometry_change_detection_files.csv \
            --github-output "$GITHUB_OUTPUT"

      - name: Run geometry rerun smoke target
        if: steps.detect.outputs.geometry_changed == 'true'
        run: |
          python scripts/run_geometry_rerun_smoke.py \
            --reason-file data/processed/geometry_change_detection.json \
            --summary-json data/processed/geometry_rerun_smoke_summary.json \
            --summary-md data/processed/geometry_rerun_smoke_summary.md

      - name: No geometry rerun required
        if: steps.detect.outputs.geometry_changed != 'true'
        run: |
          echo "No geometry-related changes detected by detector utility."

      - name: Upload geometry rerun artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-rerun-artifacts
          path: |
            data/processed/geometry_change_detection.json
            data/processed/geometry_change_detection_files.csv
            data/processed/geometry_rerun_smoke_summary.json
            data/processed/geometry_rerun_smoke_summary.md
