name: Test (with network deps)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  network-aware-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run network-aware smoke tests
        run: |
          python -m unittest -v \
            tests.test_network_validation_gate \
            tests.test_network_aware_scoring \
            tests.test_transit_transfer_assignment \
            tests.test_evaluation_batch_artifacts

  test-with-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v -m "not slow" \
            --ignore=tests/test_source_manifest.py \
            --cov=src --cov=urbansim/developer \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  behavioral-benchmark-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run behavioral validation gate
        run: |
          python scripts/validate_against_benchmarks.py \
            --output data/processed/validation_results.json
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-validation-artifacts
          path: |
            data/processed/validation_results.json

  qa-hardening-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run Week 24 end-to-end smoke
        run: |
          # KPI baseline spec is generated by the pipeline — skip if absent
          if [ ! -f data/processed/kpi_baseline_week24.json ]; then
            echo "Skipping: kpi_baseline_week24.json not present (generated by evaluation pipeline)"
            exit 0
          fi
          python scripts/run_end_to_end_smoke.py \
            --draws 40 \
            --summary-json data/processed/week24_e2e_smoke_summary.json \
            --summary-md data/processed/week24_e2e_smoke_summary.md \
            --kpi-spec data/processed/kpi_baseline_week24.json
      - name: Upload Week 24 QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week24-qa-hardening-artifacts
          path: |
            data/processed/week24_e2e_smoke_summary.json
            data/processed/week24_e2e_smoke_summary.md
            data/processed/kpi_drift_summary.json
            data/processed/kpi_drift_summary.csv
            data/processed/kpi_drift_summary.md
            data/processed/geometry_change_detection.json
            data/processed/geometry_change_detection_files.csv
            data/processed/geometry_rerun_smoke_summary.json
            data/processed/geometry_rerun_smoke_summary.md

  decision-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Build decision package
        run: |
          # Skip if required input files are not committed
          if [ ! -f data/processed/corridors_integrated_financial_zoning_with_uncertainty.csv ]; then
            echo "Skipping: input CSV not present (generated by evaluation pipeline)"
            exit 0
          fi
          python scripts/generate_decision_package.py \
            --zoning-input data/processed/corridors_integrated_financial_zoning_with_uncertainty.csv \
            --no-zoning-input data/processed/corridors_integrated_financial_no_zoning_with_uncertainty.csv \
            --output-root data/processed/decision_package \
            --top-n 10
      - name: Upload decision package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: week25-decision-package-artifacts
          path: |
            data/processed/decision_package/latest/LATEST_DECISION_PACKAGE_PATH.txt
            data/processed/decision_package/**/*.md
            data/processed/decision_package/**/*.csv
            data/processed/decision_package/**/*.svg
            data/processed/decision_package/**/run_metadata.json
